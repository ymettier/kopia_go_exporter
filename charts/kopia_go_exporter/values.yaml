# values.yaml

replicaCount: 1

image:
  repository: ghcr.io/ymettier/kopia_go_exporter
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 9090

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []
  metricRelabelings: []
  namespaceSelector: {}

resources: {}

livenessProbe:
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /metrics
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

extraVolumes: []
extraVolumeMounts: []
extraEnv: []

# Configuration served from the ConfigMap at /config/config.yaml
# ref: config.default.yaml at the root of the repository
config:
  exporter:
    port: 9090
    metrics:
      prefix: "kopia_go_exporter"
    interval: 300
  kopia:
    # Example API server connection. The server fingerprint is injected via
    # KGE_KOPIA_APISERVER_FINGERPRINT from the secret named in
    # apiserver.fingerprintSecretName.
    apiserver:
      repositoryURL: "https://some.url:port"
      fingerprintSecretName: "myapiserver-fingerprint"
    # Each client password is injected via KGE_KOPIA_CLIENTS_<NAME>_PASSWORD
    # from the secret named in clients.<name>.passwordSecretName.
    clients:
      # default:
      #   username: "mybackup"
      #   hostname: "myhostname"
      #   passwordSecretName: "mysecret"
    retentionstoextract:
      - "latest-1"
  logger:
    log_level: "info"
    json: true

nodeSelector: {}
tolerations: []
affinity: {}
